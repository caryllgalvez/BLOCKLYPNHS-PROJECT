<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Tickets · BlockLearn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --green-deep:#145a42; --green-main:#1f8a64; --green-light:#28a87a; --green-soft:#e2f3ed;
        --gold-warm:#e8a838; --gold-light:#fce9c5; --coral:#e06050; --coral-soft:#fce8e5;
        --blue:#4a90d9; --blue-soft:#e4eefb;
        --stone:#7f9e92; --stone-light:#a8bfb4;
        --border-fresh:#dde9e3; --card-white:#fff; --bg-main:#f0f6f3;
        --text-primary:#1a463a; --text-secondary:#4a6b5e;
        --nested:rgba(255,255,255,.55); --input-bg:#fff; --chart-grid:#e8f0ec;
        --grid-line:rgba(170,210,195,.3); --blob-opacity:.3; --g-overlay:rgba(255,255,255,.1);
        --sh-xs:0 2px 8px rgba(20,90,66,.04); --sh-sm:0 4px 16px rgba(20,90,66,.06);
        --sh-md:0 8px 28px rgba(20,90,66,.08); --sh-lg:0 16px 48px rgba(20,90,66,.12);
    }
    [data-theme="dark"] {
        --bg-main:#0f1f19; --text-primary:#d8ede5; --text-secondary:#a8c4b8;
        --border-fresh:#1e3a2e; --card-white:#162b22;
        --nested:rgba(255,255,255,.045); --input-bg:#1a3329; --chart-grid:#1e3a2e;
        --green-soft:#163328; --gold-light:#2e2510; --coral-soft:#2e1a16; --blue-soft:#152535;
        --stone-light:#5a7a6d; --grid-line:rgba(40,80,60,.25); --blob-opacity:.15; --g-overlay:rgba(255,255,255,.06);
        --sh-xs:0 2px 8px rgba(0,0,0,.15); --sh-sm:0 4px 16px rgba(0,0,0,.2);
        --sh-md:0 8px 28px rgba(0,0,0,.25); --sh-lg:0 16px 48px rgba(0,0,0,.3);
    }

    body {
        font-family:'Inter', system-ui, sans-serif; background:var(--bg-main);
        color:var(--text-primary); line-height:1.6; min-height:100vh; overflow-x:hidden;
        transition: background .4s, color .4s;
    }

    /* Background (same sa dashboard) */
    .bg-layer { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .bg-layer::before {
        content:''; position:absolute; inset:0;
        background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),
                         linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
        background-size:48px 48px;
    }
    .bg-blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:var(--blob-opacity); animation:drift 22s ease-in-out infinite alternate; }
    .bg-blob--1 { width:420px; height:420px; top:-12%; right:-6%; background:radial-gradient(circle, rgba(40,168,122,.4), transparent 70%); }
    .bg-blob--2 { width:340px; height:340px; bottom:-10%; left:6%; background:radial-gradient(circle, rgba(232,168,56,.25), transparent 70%); animation-duration:28s; animation-delay:-6s; }
    @keyframes drift { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(25px,-30px) scale(1.04)} }

    main { max-width:1100px; margin:0 auto; padding:26px 20px 48px; position:relative; z-index:1; }

    /* Top bar */
    .top-bar {
        display:flex; justify-content:space-between; align-items:center;
        background:rgba(255,255,255,.75); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
        border:1px solid rgba(255,255,255,.6); border-radius:24px;
        padding:.55rem 1rem .55rem .7rem; margin-bottom:1.1rem; box-shadow:var(--sh-sm);
    }
    [data-theme="dark"] .top-bar { background:rgba(22,43,34,.8); border-color:rgba(40,70,55,.6); }
    .back-pill {
        display:inline-flex; align-items:center; gap:9px; text-decoration:none;
        color:var(--green-main); font-size:.78rem; font-weight:600;
        padding:6px 14px 6px 8px; border-radius:12px; transition:background .2s;
    }
    .back-pill:hover { background:var(--green-soft); }
    .back-pill i {
        width:26px; height:26px; display:flex; align-items:center; justify-content:center;
        background:var(--green-soft); border-radius:9px; font-size:.7rem; transition:transform .25s;
    }
    .back-pill:hover i { transform:translateX(-2px); }
    [data-theme="dark"] .back-pill { color:#4ad9a0; }
    .theme-btn {
        width:36px; height:36px; border-radius:11px; border:1.5px solid var(--border-fresh);
        background:var(--card-white); color:var(--stone); font-size:.85rem; cursor:pointer;
        display:flex; align-items:center; justify-content:center; transition:all .25s;
    }
    .theme-btn:hover { border-color:var(--gold-warm); color:var(--gold-warm); transform:translateY(-1px); }
    .theme-btn:active { transform:scale(.92); }
    .theme-btn .icon-sun { display:none; }
    [data-theme="dark"] .theme-btn .icon-sun { display:inline; }
    [data-theme="dark"] .theme-btn .icon-moon { display:none; }

    /* Hero */
    .hero {
        background:linear-gradient(135deg,#14423a 0%, #1a6850 50%, #1f8a64 100%);
        border-radius:28px; padding:1.5rem 1.8rem; margin-bottom:1.2rem;
        position:relative; overflow:hidden; color:#fff; box-shadow:var(--sh-lg);
    }
    .hero::before {
        content:''; position:absolute; top:-40%; right:-8%; width:280px; height:280px; border-radius:50%;
        background:radial-gradient(circle, rgba(232,168,56,.18), transparent 65%);
    }
    .hero-dots {
        position:absolute; inset:0; pointer-events:none;
        background-image:radial-gradient(rgba(255,255,255,.08) 1.2px, transparent 1.2px);
        background-size:24px 24px;
        -webkit-mask-image:linear-gradient(115deg, transparent 25%, #000 75%);
        mask-image:linear-gradient(115deg, transparent 25%, #000 75%);
    }
    .hero-ring {
        position:absolute; right:46px; top:50%; transform:translateY(-50%);
        width:82px; height:82px; border-radius:50%;
        border:1.5px solid rgba(255,255,255,.15);
        display:flex; align-items:center; justify-content:center;
    }
    .hero-ring::before {
        content:''; position:absolute; inset:-9px; border-radius:50%;
        border:1.5px dashed rgba(232,168,56,.4); animation:ringspin 26s linear infinite;
    }
    .hero-ring i { font-size:1.5rem; color:var(--gold-warm); }
    @keyframes ringspin { to { transform:rotate(360deg); } }
    .hero h1 { font-size:1.45rem; font-weight:800; letter-spacing:-.5px; position:relative; z-index:1; }
    .hero h1 em { font-style:normal; color:var(--gold-warm); }
    .hero p { font-size:.85rem; opacity:.75; max-width:520px; position:relative; z-index:1; margin-top:.2rem; }
    .hero-chips { display:flex; gap:10px; flex-wrap:wrap; margin-top:1rem; position:relative; z-index:1; }
    .chip {
        display:inline-flex; align-items:center; gap:7px;
        background:var(--g-overlay); backdrop-filter:blur(10px);
        border:1px solid rgba(255,255,255,.08); padding:5px 14px; border-radius:20px;
        font-size:.72rem; font-weight:600;
    }
    .chip i { font-size:.66rem; }
    .chip strong { font-weight:800; font-variant-numeric:tabular-nums; }

    /* Grid + panels */
    .grid { display:grid; grid-template-columns:360px 1fr; gap:1.1rem; align-items:start; }
    .panel {
        background:rgba(255,255,255,.8); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid rgba(255,255,255,.6); border-radius:24px;
        padding:1.3rem 1.4rem; box-shadow:var(--sh-sm);
        transition:background .4s, border-color .4s;
    }
    [data-theme="dark"] .panel { background:rgba(22,43,34,.85); border-color:rgba(40,70,55,.6); }
    .panel--form { position:sticky; top:24px; }
    .panel h2 { font-size:.95rem; font-weight:800; margin-bottom:1rem; }
    .panel h2 i { color:var(--gold-warm); margin-right:7px; font-size:.82rem; }

    /* Form */
    .field { margin-bottom:.9rem; }
    label { display:block; font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--stone); margin-bottom:6px; }
    input, select, textarea {
        width:100%; border:1.5px solid var(--border-fresh); border-radius:12px;
        padding:.62rem .8rem; font:inherit; font-size:.82rem;
        background:var(--input-bg); color:var(--text-primary); transition:all .25s;
    }
    input::placeholder, textarea::placeholder { color:var(--stone-light); }
    input:focus, select:focus, textarea:focus {
        outline:none; border-color:var(--green-main); box-shadow:0 0 0 3px rgba(31,138,100,.12);
    }
    textarea { min-height:110px; resize:vertical; }
    .char-row { display:flex; justify-content:space-between; margin-top:5px; font-size:.62rem; color:var(--stone-light); }
    .char-row b { font-variant-numeric:tabular-nums; }

    .seg {
        display:grid; grid-template-columns:repeat(3,1fr); gap:5px;
        background:var(--nested); border:1px solid var(--border-fresh); border-radius:12px; padding:5px;
    }
    .seg button {
        border:0; background:transparent; border-radius:9px; padding:.5rem .3rem;
        font:inherit; font-size:.72rem; font-weight:700; color:var(--stone); cursor:pointer;
        display:flex; align-items:center; justify-content:center; gap:6px; transition:all .25s;
    }
    .seg button i { font-size:.6rem; }
    .seg button:hover { color:var(--text-primary); }
    .seg button.active.v-low { background:var(--blue-soft); color:var(--blue); }
    .seg button.active.v-medium { background:var(--gold-light); color:#9a7020; }
    .seg button.active.v-high { background:var(--coral-soft); color:var(--coral); }

    .submit-btn {
        width:100%; margin-top:1rem; border:0; border-radius:14px; padding:.85rem;
        background:linear-gradient(135deg, var(--green-main), var(--green-light)); color:#fff;
        font:inherit; font-weight:700; font-size:.85rem; cursor:pointer;
        display:flex; align-items:center; justify-content:center; gap:9px;
        box-shadow:0 6px 20px rgba(31,138,100,.25); transition:all .25s;
    }
    .submit-btn:hover { transform:translateY(-1px); filter:brightness(1.04); }
    .submit-btn:active { transform:translateY(0) scale(.98); }
    .submit-btn:disabled { opacity:.7; cursor:not-allowed; transform:none; }
    .submit-btn .spinner {
        display:none; width:15px; height:15px; border:2px solid rgba(255,255,255,.35);
        border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
    }
    .submit-btn.loading .spinner { display:block; }
    .submit-btn.loading .btn-icon { display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* List tools */
    .list-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem; }
    .refresh-btn {
        width:34px; height:34px; border-radius:10px; border:1.5px solid var(--border-fresh);
        background:var(--card-white); color:var(--stone); font-size:.8rem; cursor:pointer;
        display:flex; align-items:center; justify-content:center; transition:all .25s;
    }
    .refresh-btn:hover { border-color:var(--green-main); color:var(--green-main); }
    .refresh-btn.spinning i { animation:spin .8s linear infinite; }
    .list-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
    .tabs {
        display:inline-flex; gap:3px; background:var(--nested);
        border:1px solid var(--border-fresh); border-radius:12px; padding:4px;
    }
    .tab {
        border:0; background:transparent; border-radius:9px; padding:.4rem .75rem;
        font:inherit; font-size:.7rem; font-weight:600; color:var(--stone); cursor:pointer; transition:all .2s;
    }
    .tab:hover { color:var(--text-primary); }
    .tab.active { background:var(--card-white); color:var(--green-deep); box-shadow:var(--sh-xs); }
    [data-theme="dark"] .tab.active { color:#4ad9a0; }
    .tab .cnt { font-size:.6rem; opacity:.65; margin-left:4px; font-variant-numeric:tabular-nums; }
    .search { flex:1; min-width:180px; position:relative; display:flex; align-items:center; }
    .search i { position:absolute; left:11px; color:var(--stone-light); font-size:.72rem; pointer-events:none; }
    .search input { padding-left:2.1rem; font-size:.76rem; border-radius:12px; }
    .search input:focus { box-shadow:0 0 0 3px rgba(31,138,100,.12); }

    /* Ticket cards */
    .ticket {
        background:var(--nested); border:1px solid var(--border-fresh);
        border-left:3px solid var(--accent, var(--stone-light));
        border-radius:18px; padding:1rem 1.1rem; margin-bottom:.7rem; transition:all .25s;
    }
    .ticket:hover { transform:translateY(-2px); box-shadow:var(--sh-md); border-color:var(--border-fresh); }
    .ticket.p-low { --accent:var(--blue); }
    .ticket.p-medium { --accent:var(--gold-warm); }
    .ticket.p-high { --accent:var(--coral); }
    .ticket-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:.5rem; }
    .tk-no {
        font-size:.66rem; font-weight:800; color:var(--gold-warm);
        letter-spacing:.5px; font-variant-numeric:tabular-nums;
    }
    .status {
        display:inline-flex; align-items:center; gap:6px;
        font-size:.62rem; font-weight:700; padding:.28rem .7rem; border-radius:20px; white-space:nowrap;
    }
    .status i { font-size:.58rem; }
    .st-pending { background:var(--gold-light); color:#9a7020; }
    .st-progress { background:var(--blue-soft); color:var(--blue); }
    .st-resolved { background:var(--green-soft); color:var(--green-deep); }
    .st-closed { background:var(--nested); color:var(--stone); }
    [data-theme="dark"] .st-pending { color:#e8c568; }
    [data-theme="dark"] .st-resolved { color:#4ad9a0; }
    .ticket h3 { font-size:.9rem; font-weight:750; margin-bottom:.3rem; }
    .tk-desc {
        font-size:.78rem; color:var(--text-secondary);
        display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .ticket-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:.7rem; font-size:.64rem; }
    .pill {
        display:inline-flex; align-items:center; gap:5px;
        padding:.25rem .65rem; border-radius:20px; font-weight:700; white-space:nowrap;
    }
    .pill i { font-size:.55rem; }
    .pr-low { background:var(--blue-soft); color:var(--blue); }
    .pr-medium { background:var(--gold-light); color:#9a7020; }
    .pr-high { background:var(--coral-soft); color:var(--coral); }
    [data-theme="dark"] .pr-medium { color:#e8c568; }
    .pill-cat { background:var(--nested); color:var(--stone); border:1px solid var(--border-fresh); }
    .tk-time { display:inline-flex; align-items:center; gap:5px; margin-left:auto; color:var(--stone-light); }
    .tk-resolved {
        display:flex; align-items:center; gap:7px; margin-top:.6rem;
        font-size:.66rem; font-weight:600; color:var(--green-main);
        background:var(--green-soft); border-radius:10px; padding:.4rem .7rem; width:fit-content;
    }
    [data-theme="dark"] .tk-resolved { color:#4ad9a0; }

    /* Skeleton / empty / error */
    .skel-line {
        height:10px; border-radius:6px; margin-bottom:9px;
        background:linear-gradient(90deg, var(--chart-grid) 25%, var(--nested) 50%, var(--chart-grid) 75%);
        background-size:200% 100%; animation:sk 1.2s infinite;
    }
    .skel-line.w30 { width:30%; } .skel-line.w60 { width:60%; }
    .skel-line.w90 { width:90%; } .skel-line.w70 { width:70%; }
    @keyframes sk { to { background-position:-200% 0; } }
    .empty { padding:2.5rem 1rem; text-align:center; }
    .empty i { font-size:2rem; color:var(--border-fresh); margin-bottom:.6rem; display:block; }
    .empty p { font-size:.8rem; color:var(--stone-light); }
    .empty small { font-size:.68rem; color:var(--stone-light); opacity:.7; display:block; margin-top:.2rem; }
    .retry-btn {
        margin-top:1rem; border:1.5px solid var(--border-fresh); background:var(--card-white);
        color:var(--green-main); border-radius:12px; padding:.5rem 1rem;
        font:inherit; font-size:.74rem; font-weight:700; cursor:pointer; transition:all .2s;
        display:inline-flex; align-items:center; gap:7px;
    }
    .retry-btn:hover { border-color:var(--green-main); background:var(--green-soft); }

    /* Toast */
    .toast-box { position:fixed; bottom:24px; right:24px; z-index:99999; display:flex; flex-direction:column; gap:8px; }
    .toast-msg {
        background:#1a463a; color:#fff; padding:10px 16px; border-radius:12px;
        font-size:.78rem; font-weight:500; box-shadow:0 8px 32px rgba(0,0,0,.2);
        display:flex; align-items:center; gap:8px; position:relative; overflow:hidden;
        animation:tIn .4s cubic-bezier(.4,0,.2,1); transition:all .3s;
    }
    .toast-msg i { color:var(--gold-warm); }
    .toast-msg.error i { color:var(--coral); }
    .toast-msg.out { opacity:0; transform:translateX(40px); }
    .toast-msg::after {
        content:''; position:absolute; left:0; bottom:0; height:2.5px;
        background:var(--gold-warm); width:100%; animation:ttimer 3.2s linear forwards;
    }
    @keyframes tIn { from { opacity:0; transform:translateX(40px) scale(.95); } to { opacity:1; transform:none; } }
    @keyframes ttimer { to { width:0; } }

    /* Entrance */
    .fu { opacity:0; transform:translateY(16px); animation:fuA .5s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes fuA { to { opacity:1; transform:none; } }
    .e1 { animation-delay:.05s; } .e2 { animation-delay:.12s; } .e3 { animation-delay:.2s; } .e4 { animation-delay:.28s; }

    ::selection { background:var(--green-main); color:#fff; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline:2px solid var(--green-main); outline-offset:2px;
    }

    @media (max-width:960px) {
        .grid { grid-template-columns:1fr; }
        .panel--form { position:static; }
        .hero-ring { display:none; }
    }
    @media (max-width:576px) {
        main { padding:16px 12px 32px; }
        .hero { padding:1.2rem 1.3rem; }
        .hero h1 { font-size:1.2rem; }
        .list-tools { flex-direction:column; align-items:stretch; }
        .search { min-width:0; }
        .toast-box { left:12px; right:12px; bottom:12px; }
        .toast-msg { justify-content:center; }
    }
    @media (prefers-reduced-motion:reduce) {
        *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }
</style>
</head>
<body>

<div class="bg-layer" aria-hidden="true">
    <div class="bg-blob bg-blob--1"></div>
    <div class="bg-blob bg-blob--2"></div>
</div>

<main>
    <nav class="top-bar fu e1">
        <a class="back-pill" href="/student_dashboard"><i class="fas fa-arrow-left"></i>Back to Dashboard</a>
        <div style="display:flex;align-items:center;gap:8px;">
            <a class="back-pill" href="/student_help"><i class="fas fa-circle-question"></i>Help &amp; FAQ</a>
            <button class="theme-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
                <i class="fas fa-moon icon-moon"></i><i class="fas fa-sun icon-sun"></i>
            </button>
        </div>
    </nav>

    <header class="hero fu e2">
        <span class="hero-dots"></span>
        <div class="hero-ring"><i class="fas fa-headset"></i></div>
        <h1>Support <em>Center</em></h1>
        <p>Submit a ticket and track your requests here. Our team usually responds within 24 hours.</p>
        <div class="hero-chips">
            <span class="chip"><i class="fas fa-inbox"></i>Total <strong id="statTotal">0</strong></span>
            <span class="chip"><i class="fas fa-hourglass-half"></i>Open <strong id="statOpen">0</strong></span>
            <span class="chip"><i class="fas fa-circle-check"></i>Resolved <strong id="statResolved">0</strong></span>
        </div>
    </header>

    <div class="grid">
        <section class="panel panel--form fu e3">
            <h2><i class="fas fa-paper-plane"></i>Submit a Ticket</h2>
            <form id="ticketForm">
                <div class="field">
                    <label for="subject">Subject</label>
                    <input id="subject" required maxlength="255" placeholder="What do you need help with?">
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="technical">Technical Issue</option>
                        <option value="account">Account &amp; Login</option>
                        <option value="grades">Grades &amp; Assessments</option>
                        <option value="content">Course Content</option>
                        <option value="other" selected>Other</option>
                    </select>
                </div>
                <div class="field">
                    <label>Priority</label>
                    <div class="seg" id="prioritySeg">
                        <button type="button" data-value="low" class="v-low"><i class="fas fa-arrow-down"></i>Low</button>
                        <button type="button" data-value="medium" class="v-medium active"><i class="fas fa-equals"></i>Medium</button>
                        <button type="button" data-value="high" class="v-high"><i class="fas fa-arrow-up"></i>High</button>
                    </div>
                    <input type="hidden" id="priority" value="medium">
                </div>
                <div class="field">
                    <label for="messageInput">Message</label>
                    <textarea id="messageInput" required maxlength="1000" placeholder="Describe the issue in detail…"></textarea>
                    <div class="char-row"><span>Be as specific as possible</span><span><b id="charCount">0</b>/1000</span></div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="spinner"></span>
                    <i class="fas fa-paper-plane btn-icon"></i>
                    <span class="btn-label">Submit Ticket</span>
                </button>
            </form>
        </section>

        <section class="panel fu e4">
            <div class="list-head">
                <h2><i class="fas fa-ticket"></i>My Tickets</h2>
                <button class="refresh-btn" id="refreshBtn" title="Refresh" aria-label="Refresh tickets"><i class="fas fa-rotate"></i></button>
            </div>
            <div class="list-tools">
                <div class="tabs" id="tabs">
                    <button class="tab active" data-filter="all">All<span class="cnt" id="cntAll">0</span></button>
                    <button class="tab" data-filter="open">Open<span class="cnt" id="cntOpen">0</span></button>
                    <button class="tab" data-filter="resolved">Resolved<span class="cnt" id="cntResolved">0</span></button>
                </div>
                <div class="search">
                    <i class="fas fa-magnifying-glass"></i>
                    <input id="ticketSearch" placeholder="Search subject, message, or ticket #">
                </div>
            </div>
            <div id="ticketList"></div>
        </section>
    </div>
</main>

<div class="toast-box" id="toastBox"></div>

<script>
const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

/* ── Theme ── */
const applyTheme = t => { document.documentElement.dataset.theme = t; localStorage.setItem('bl-theme', t); };
applyTheme(localStorage.getItem('bl-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
 $('themeBtn').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

/* ── Status / priority / category maps (match sa DB columns) ── */
const STATUS_META = {
    pending:     { label:'Pending',     cls:'st-pending', icon:'fa-clock' },
    open:        { label:'Open',        cls:'st-pending', icon:'fa-clock' },
    in_progress: { label:'In Progress', cls:'st-progress', icon:'fa-spinner' },
    answered:    { label:'Answered',    cls:'st-progress', icon:'fa-reply' },
    resolved:    { label:'Resolved',    cls:'st-resolved', icon:'fa-circle-check' },
    closed:      { label:'Closed',      cls:'st-closed',  icon:'fa-lock' }
};
const PRIORITY_META = {
    low:    { cls:'pr-low',    icon:'fa-arrow-down' },
    medium: { cls:'pr-medium', icon:'fa-equals' },
    high:   { cls:'pr-high',   icon:'fa-arrow-up' }
};
const CATEGORY_LABELS = {
    technical:'Technical', account:'Account', grades:'Grades', content:'Content', other:'Other'
};

const normStatus = s => String(s || 'pending').toLowerCase().replace(/\s+/g, '_');
const catLabel = c => CATEGORY_LABELS[String(c).toLowerCase()] || String(c).charAt(0).toUpperCase() + String(c).slice(1);

/* ── Time helpers (handles "YYYY-MM-DD HH:MM:SS" galing MySQL) ── */
const parseDate = s => { if (!s) return null; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? null : d; };
function timeAgo(s) {
    const d = parseDate(s); if (!d) return '';
    const sec = (Date.now() - d.getTime()) / 1000;
    if (sec < 0) return '';
    if (sec < 60) return 'just now';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
    if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
    if (sec < 604800) return Math.floor(sec / 86400) + 'd ago';
    return d.toLocaleDateString();
}
const fullDate = s => { const d = parseDate(s); return d ? d.toLocaleString() : ''; };

/* ── State ── */
let allTickets = [];
let activeFilter = 'all';

/* ── Toast ── */
function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = 'toast-msg' + (type === 'error' ? ' error' : '');
    el.innerHTML = `<i class="fas ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${escapeHtml(msg)}</span>`;
    $('toastBox').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 350); }, 3200);
}

/* ── Render ── */
function renderTickets() {
    const list = $('ticketList');
    const q = $('ticketSearch').value.trim().toLowerCase();

    // Counts muna (para sa chips + tab counts)
    const total = allTickets.length;
    const open = allTickets.filter(t => !['resolved', 'closed'].includes(normStatus(t.status))).length;
    const resolved = allTickets.filter(t => normStatus(t.status) === 'resolved').length;
    $('statTotal').textContent = total; $('statOpen').textContent = open; $('statResolved').textContent = resolved;
    $('cntAll').textContent = total; $('cntOpen').textContent = open; $('cntResolved').textContent = resolved;

    // Filter + search
    let items = allTickets.filter(t => {
        const st = normStatus(t.status);
        if (activeFilter === 'open' && ['resolved', 'closed'].includes(st)) return false;
        if (activeFilter === 'resolved' && st !== 'resolved') return false;
        if (q) {
            const hay = `${t.subject || ''} ${t.description || t.message || ''} ${t.ticket_number || t.id || ''}`.toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    });

    // Newest first
    items.sort((a, b) => (parseDate(b.created_at) || 0) - (parseDate(a.created_at) || 0));

    if (!items.length) {
        list.innerHTML = allTickets.length
            ? `<div class="empty"><i class="fas fa-filter"></i><p>No tickets match your filters.</p></div>`
            : `<div class="empty"><i class="fas fa-inbox"></i><p>No tickets yet.</p><small>Your submitted tickets will appear here.</small></div>`;
        return;
    }

    list.innerHTML = items.map(t => {
        // DB fields: description, pero fallback sa message para backwards-compatible
        const desc = t.description ?? t.message ?? '';
        const num = String(t.ticket_number ?? t.id ?? '');
        const displayNum = /^\d+$/.test(num) ? '#' + num : num;
        const st = normStatus(t.status);
        const pr = String(t.priority || 'medium').toLowerCase();
        const sm = STATUS_META[st] || STATUS_META.pending;
        const pm = PRIORITY_META[pr] || PRIORITY_META.medium;
        return `
        <article class="ticket p-${escapeHtml(pr)}" title="Created ${escapeHtml(fullDate(t.created_at))}">
            <div class="ticket-top">
                <span class="tk-no">${escapeHtml(displayNum)}</span>
                <span class="status ${sm.cls}"><i class="fas ${sm.icon}"></i>${sm.label}</span>
            </div>
            <h3>${escapeHtml(t.subject)}</h3>
            <p class="tk-desc">${escapeHtml(desc)}</p>
            <div class="ticket-meta">
                <span class="pill ${pm.cls}"><i class="fas ${pm.icon}"></i>${pr.charAt(0).toUpperCase() + pr.slice(1)}</span>
                ${t.category ? `<span class="pill pill-cat"><i class="fas fa-folder-open"></i>${escapeHtml(catLabel(t.category))}</span>` : ''}
                <span class="tk-time"><i class="fas fa-clock"></i>${escapeHtml(timeAgo(t.created_at) || t.created_at || '')}</span>
            </div>
            ${st === 'resolved' && t.resolved_at ? `<div class="tk-resolved"><i class="fas fa-circle-check"></i>Resolved ${escapeHtml(timeAgo(t.resolved_at))}</div>` : ''}
        </article>`;
    }).join('');
}

/* ── Load ── */
async function loadTickets() {
    const list = $('ticketList'), refresh = $('refreshBtn');
    refresh.classList.add('spinning');
    list.innerHTML = Array(3).fill(`<div class="ticket"><div class="skel-line w30"></div><div class="skel-line w90"></div><div class="skel-line w70"></div><div class="skel-line w60"></div></div>`).join('');
    try {
        const response = await fetch('/get_tickets');
        const data = await response.json();
        if (!data.success) {
            list.innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><p>${escapeHtml(data.message || 'Unable to load tickets.')}</p><button class="retry-btn" onclick="loadTickets()"><i class="fas fa-rotate"></i>Try Again</button></div>`;
            return;
        }
        allTickets = data.tickets || [];
        renderTickets();
    } catch {
        list.innerHTML = `<div class="empty"><i class="fas fa-wifi"></i><p>Network error. Check your connection.</p><button class="retry-btn" onclick="loadTickets()"><i class="fas fa-rotate"></i>Try Again</button></div>`;
    } finally {
        refresh.classList.remove('spinning');
    }
}

/* ── Priority segmented control ── */
 $('prioritySeg').querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
        $('prioritySeg').querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        $('priority').value = btn.dataset.value;
    });
});

/* ── Char counter ── */
 $('messageInput').addEventListener('input', () => { $('charCount').textContent = $('messageInput').value.length; });

/* ── Tabs + search ── */
 $('tabs').querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        $('tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeFilter = tab.dataset.filter;
        renderTickets();
    });
});
 $('ticketSearch').addEventListener('input', renderTickets);
 $('refreshBtn').addEventListener('click', loadTickets);

/* ── Submit ── */
 $('ticketForm').addEventListener('submit', async event => {
    event.preventDefault();
    const btn = $('submitBtn');
    const subject = $('subject').value.trim();
    const message = $('messageInput').value.trim();
    const priority = $('priority').value;
    const category = $('category').value;

    btn.classList.add('loading'); btn.disabled = true;
    try {
        const response = await fetch('/submit_ticket', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            // description + message pareho ang value — kung alsa backend ang gamit mo, gagana pa rin
            body: JSON.stringify({ subject, priority, category, message, description: message })
        });
        const data = await response.json();
        if (data.success) {
            toast(data.message || 'Ticket submitted successfully!');
            event.target.reset();
            $('prioritySeg').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.value === 'medium'));
            $('priority').value = 'medium';
            $('charCount').textContent = '0';
            loadTickets();
        } else {
            toast(data.message || 'Unable to submit ticket.', 'error');
        }
    } catch {
        toast('Network error. Please try again.', 'error');
    } finally {
        btn.classList.remove('loading'); btn.disabled = false;
    }
});

loadTickets();
</script>
</body>
</html>
