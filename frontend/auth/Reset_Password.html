<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · BlockLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f0f6f3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 8px 40px rgba(20, 90, 66, 0.08);
            border: 1px solid #dde9e3;
        }
        .reset-card .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1a463a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 0;
        }
        .reset-card .logo em { font-style: normal; color: #e8a838; }
        .reset-card h2 { font-size: 1.2rem; font-weight: 700; color: #1a463a; margin-bottom: 6px; }
        .reset-card p { color: #4a6b5e; font-size: 0.9rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-weight: 600; font-size: 0.8rem; color: #4a6b5e; display: block; margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #dde9e3;
            border-radius: 12px;
            font-size: 0.9rem;
            background: #f0f6f3;
            transition: 0.25s;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1f8a64;
            box-shadow: 0 0 0 3px rgba(31, 138, 100, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            background: #1f8a64;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
        }
        .btn-submit:hover { background: #145a42; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(31, 138, 100, 0.3); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 0.85rem; color: #4a6b5e; }
        .back-link a { color: #1f8a64; text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
        .alert { padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
        .alert-success { background: #e2f3ed; color: #145a42; border: 1px solid #b8d9cc; display: block; }
        .alert-error { background: #fce8e5; color: #b33a2a; border: 1px solid #f5cdc5; display: block; }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .password-hint { font-size: 0.7rem; color: #7f9e92; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo">Block<em>Learn</em></div>
        <h2>Set New Password</h2>
        <p>Enter your new password below.</p>
        <div id="alertBox" class="alert"></div>
        <form id="resetForm">
            <div class="form-group">
                <label for="passwordInput"><i class="fas fa-lock"></i> New Password</label>
                <input type="password" id="passwordInput" placeholder="Min 8 characters" required />
                <div class="password-hint">Minimum 8 characters</div>
            </div>
            <div class="form-group">
                <label for="confirmInput"><i class="fas fa-check-circle"></i> Confirm Password</label>
                <input type="password" id="confirmInput" placeholder="Re-enter new password" required />
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Reset Password</span>
            </button>
        </form>
        <div class="back-link">
            <a href="/login">← Back to Login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('passwordInput');
        const confirmInput = document.getElementById('confirmInput');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordInput.value.trim();
            const confirm = confirmInput.value.trim();

            if (!password || password.length < 6) {
                showAlert('Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirm) {
                showAlert('Passwords do not match.', 'error');
                return;
            }
            if (!token) {
                showAlert('Invalid or missing reset token.', 'error');
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> Resetting...';

            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password, confirm_password: confirm })
                });
                const data = await response.json();
                if (data.success) {
                    showAlert(data.message, 'success');
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    showAlert(data.message || 'Failed to reset password.', 'error');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Reset Password';
            }
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert';
            if (type === 'success') alertBox.classList.add('alert-success');
            else if (type === 'error') alertBox.classList.add('alert-error');
            else alertBox.style.display = 'block';
            clearTimeout(window.alertTimeout);
            window.alertTimeout = setTimeout(() => {
                alertBox.style.display = 'none';
                alertBox.className = 'alert';
            }, 8000);
        }

        // Pre-fill token if present in URL (for debugging)
        console.log('Reset token:', token);
    </script>
</body>
</html>
